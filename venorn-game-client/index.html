<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>venorn</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <nav id="tray" aria-label="Things to pin"></nav>
    <header id="actions">
      <button id="front" type="button">Front view</button>
      <button id="arrange" type="button">Arrange as painted</button>
      <button id="clear" type="button">Clear</button>
      <label><input id="painted" type="checkbox" /> Painted skull</label>
      <label><input id="sound" type="checkbox" /> Cloud sound</label>
    </header>
    <aside id="adjust" hidden aria-label="Adjust the selected thing"></aside>
    <p id="status" role="status"></p>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
