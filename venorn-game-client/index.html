<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>venorn</title>
    <meta name="description" content="A calm game of adorning a skull in a meadow, after Fawnicorn's painting Veneration, Ornamentation." />
    <meta name="theme-color" content="#0458a1" />
    <!-- Added to a home screen or the Dock, the game opens as an app. mise-tasks/app-images in the asset
         pipeline makes the icons and launch screens from the painting. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/app/icon-192.png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="venorn" />
    <!-- An iPhone app draws under the status bar, and the page keeps its controls inside the safe area. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS shows a launch screen only when one matches the screen's size exactly. -->
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/app/launch-1206x2622.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/app/launch-1320x2868.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/app/launch-1260x2736.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/app/launch-1179x2556.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/app/launch-1290x2796.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/app/launch-1170x2532.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/app/launch-1284x2778.jpg" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="safe" aria-hidden="true"></div>

    <button id="more" type="button" aria-expanded="false" aria-controls="menu" title="More">⋯</button>
    <nav id="menu" hidden aria-label="More">
      <button id="about-open" type="button">About</button>
      <button id="front" type="button">Front view</button>
      <button id="rear" type="button">Rear view</button>
      <button id="arrange" type="button">Arrange as painted</button>
      <button id="clear" type="button">Clear</button>
      <button id="bring-back" type="button" hidden>Bring back the last skull</button>
      <label><input id="painted" type="checkbox" /> Painted skull</label>
      <label><input id="sound" type="checkbox" checked /> Sound</label>
      <button id="install" type="button" hidden>Install as an app</button>
    </nav>
    <p id="status" role="status"></p>
    <button id="let-go" type="button" hidden title="Let go of the selected thing (Escape)">Done</button>

    <div id="strip" role="listbox" aria-label="Variations"></div>
    <nav id="dock" aria-label="Categories"></nav>

    <div id="ring" hidden></div>
    <div id="wheel" hidden aria-label="Adjust the selected thing">
      <button type="button" data-action="kind">Kind</button>
      <button type="button" data-action="variation">Variation</button>
      <button type="button" data-action="design">Design</button>
      <button type="button" data-action="remove">Remove</button>
    </div>
    <aside id="design" hidden aria-label="Design of the selected thing"></aside>

    <!-- The painting the game is made from. src/about.ts fills it from the asset set's manifest and opens it. -->
    <dialog id="about" aria-labelledby="about-title">
      <h1 id="about-title"></h1>
      <p id="about-artist"></p>
      <img id="about-painting" alt="" decoding="async" />
      <a id="about-page" target="_blank" rel="noopener"></a>
      <button id="about-start" type="button" autofocus>Start</button>
      <p id="about-version"></p>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
