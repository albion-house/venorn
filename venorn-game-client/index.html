<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>venorn</title>
    <!-- No icon of its own yet. An empty one keeps the browser from asking for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <button id="more" type="button" aria-expanded="false" aria-controls="menu" title="More">⋯</button>
    <nav id="menu" hidden aria-label="More">
      <button id="front" type="button">Front view</button>
      <button id="rear" type="button">Rear view</button>
      <button id="arrange" type="button">Arrange as painted</button>
      <button id="clear" type="button">Clear</button>
      <button id="bring-back" type="button" hidden>Bring back the last skull</button>
      <label><input id="painted" type="checkbox" /> Painted skull</label>
      <label><input id="sound" type="checkbox" checked /> Sound</label>
    </nav>
    <p id="status" role="status"></p>

    <div id="strip" role="listbox" aria-label="Variations"></div>
    <nav id="dock" aria-label="Categories"></nav>

    <div id="ring" hidden></div>
    <div id="wheel" hidden aria-label="Adjust the selected thing">
      <button type="button" data-action="kind">Kind</button>
      <button type="button" data-action="variation">Variation</button>
      <button type="button" data-action="design">Design</button>
      <button type="button" data-action="remove">Remove</button>
    </div>
    <aside id="design" hidden aria-label="Design of the selected thing"></aside>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
