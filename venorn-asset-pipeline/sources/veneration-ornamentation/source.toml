name = "veneration-ornamentation"
title = "Veneration Ornamentation"

[image]
url = "https://fawnicorn.com/assets/art/veneration-ornamentation.jpg"
sha256 = "cee2789a4be34d8a91ea36cc81c4d37f80cb5f64d472590a0368c8b5f89af402"

# The surface that things are pinned to. Each prompt is looked for in the whole
# image, and the parts found are joined into one model.
[structure]
id = "skull"
prompts = ["skull", "horn"]
# Half the structure's depth as a fraction of its longer side. The far side
# mirrors the near side.
thickness = 0.17

# The scene around the structure, split into four layers.

# A band along the bottom of the image that the structure rests in.
[scene.ground]
id = "meadow"

# The distant layer: background pixels with a hue in this range, in degrees.
# distance is how far from the structure the layer stands, in structure lengths.
[scene.far]
id = "forest"
hue = [62, 178]
distance = 8.5

# Everything else that stands out from the backdrop.
[scene.floating]
id = "clouds"
distance = 6.5
motion = "drift"

# A smooth vertical gradient behind everything.
[scene.backdrop]
id = "sky"

# Each kind is a thing the player can put on the structure.
#
#   find        "detector" (the default) looks for the prompt and names what it
#               finds with looks_like; "painted" takes the patches of the
#               structure that carry paint in the hue range
#   prompt      words the detector looks for
#   looks_like  a short description the classifier uses to tell kinds apart
#   hue         for a painted kind, the hue range of its paint in degrees
#   carries     for a painted kind, the kinds whose instances join the paint
#               they sit on
#   role        "pinned" is a solid thing held on with a pin;
#               "printed" is a flat motif that follows the surface
#   exemplars   how many of the instances found become models
#   thickness   the thing's greatest depth as a fraction of its shorter side;
#               1.0 makes a round cross-section
#   criteria    values that replace the role's default adjustment criteria

[[kinds]]
id = "butterfly"
prompt = "butterfly"
looks_like = "a butterfly"
role = "pinned"
exemplars = 3
thickness = 0.14

# A pinned butterfly holds its wings up from the surface.
[kinds.criteria.adjust.fold]
default = 28.0
min = 0.0
max = 70.0

[[kinds]]
id = "candy"
prompt = "candy"
looks_like = "a wrapped candy with twisted wrapper ends"
role = "pinned"
exemplars = 6
thickness = 0.85

[[kinds]]
id = "capsule"
prompt = "pill"
looks_like = "a two-colored medicine capsule"
role = "pinned"
exemplars = 6
thickness = 1.0

[[kinds]]
id = "bead"
prompt = "bead"
looks_like = "a round bead on a pin"
role = "pinned"
exemplars = 6
thickness = 1.0

[[kinds]]
id = "flower"
prompt = "flower"
looks_like = "a flower"
role = "pinned"
exemplars = 6
thickness = 0.5

# A flower sits close to the surface and can be pressed flat onto it.
[kinds.criteria.attach.standoff]
default = 0.03
min = 0.0
max = 0.4

[kinds.criteria.adjust.conform]
default = 0.0
min = 0.0
max = 1.0

# The plants painted onto the bone: yellow-green stems and leaves that lie
# flat, with the flowers they carry standing out.
[[kinds]]
id = "sprig"
find = "painted"
hue = [44, 170]
carries = ["flower"]
role = "printed"
exemplars = 7
thickness = 0.5

# The groups the player chooses from, in the order of the number keys 1 to 5.
# Every kind belongs to one category.

[[categories]]
id = "butterflies"
name = "Butterflies"
kinds = ["butterfly"]

[[categories]]
id = "candies"
name = "Candies"
kinds = ["candy"]

[[categories]]
id = "pills"
name = "Pills"
kinds = ["capsule"]

[[categories]]
id = "jewels"
name = "Jewels"
kinds = ["bead"]

[[categories]]
id = "flowers"
name = "Flowers"
kinds = ["flower", "sprig"]
